<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Pzzlr link preview</title>
		<link rel="stylesheet" href="base.css" />
	</head>
	<!-- The og:image every page on the site shares: the landing page's own
	     headline and demo, on the dark ground with the blue dark mark, so a pasted link looks
	     like the page it opens. -->
	<body class="theme-dark">
		<main class="frame" style="--visual-w: 42rem">
			<div class="copy-col">
				<div class="brand"><img src="pz-blue-dark.svg" alt="Pzzlr" /></div>
				<div class="copy">
					<h1>Make a word game out of any word you like</h1>
					<p class="lead">
						A fresh puzzle every day, with a link anyone can play. Free, and free of ads.
					</p>
				</div>
				<div class="url">pzzlr.app</div>
			</div>
			<div class="visual">
				<div class="tiles ladder" id="ladder" style="--cols: 4; --rows: 5"></div>
			</div>
		</main>
		<script src="tiles.js"></script>
		<script>
			drawLadder(
				document.getElementById('ladder'),
				['COLD', 'CORD', 'WORD', 'WARD', 'WARM'],
				'WARM'
			);
		</script>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Applies a saved theme before the first paint, so a dark-mode reader
		     never gets a white flash on the way in. Deliberately tiny and
		     inline: anything that arrives with the bundle arrives too late.
		     The key matches THEME_KEY in $lib/theme.svelte.ts. -->
		<script>
			try {
				var t = localStorage.getItem('pzzlr-theme');
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
			} catch (e) {
				// Storage blocked — the system preference still applies.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
